[workspace]
authors = ["rivques <web@rivques.dev>"]
# To add more authors, append entries to the list above, e.g.:
# authors = ["Alice <alice@olin.edu>", "Bob <bob@olin.edu>"]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
name = "maze_solving_neato"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "colcon build --symlink-install"
ros-clean = "rm -r build install log"
# Run a node from maze_solver. Defaults to maze_runner, or pass a different node name as an argument.
# e.g.: pixi run maze_solver          (runs maze_runner)
#        pixi run maze_solver other_node
maze_solver = { cmd = "ros2 run maze_solver {{node}}", "args" = [{"arg"= "node", "default"= "maze_runner"}] }
test = "pytest -v --tb=short src/maze_solver"
gazebo-empty = "ros2 launch neato2_gazebo empty_world.py"
gazebo-gauntlet = "ros2 launch neato2_gazebo neato_gauntlet_world.py"
# Connect to a physical Neato: pixi run connect-neato 192.168.XXX.XXX
connect-neato = { cmd = "ros2 launch neato_node2 bringup.py host:={args}" }
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard"
rviz = "ros2 run rviz2 rviz2"
rqt = "ros2 run rqt_gui rqt_gui"

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ros-gz = ">=1.0.24,<2"
ros-jazzy-nav2-bringup = ">=1.3.13,<2"
ros-jazzy-navigation2 = ">=1.3.13,<2"
ros-jazzy-camera-info-manager = ">=5.1.8,<6"
ros-jazzy-cartographer-ros = ">=2.0.9003,<3"
ros-jazzy-cartographer = ">=2.0.0,<3"
scikit-build = ">=0.19.0,<0.20"
opencv = ">=5.0.0,<6"
scikit-learn = ">=1.9.1,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<80"
ros-jazzy-ament-cmake-auto = ">=2.5.6,<3"
compilers = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
ros2-launch-pytest = ">=3.4.12,<4"

[activation]
scripts = ["install/setup.bash"]
